<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<canvas id="c192" width="192" height="192" style="display:none"></canvas>
<canvas id="c512" width="512" height="512" style="display:none"></canvas>
<p>Generating icons... check Downloads folder.</p>
<script>
function drawIcon(canvas, img) {
  const ctx = canvas.getContext('2d');
  const s = canvas.width;
  const r = s * 0.18;

  // Rounded clip
  ctx.beginPath();
  ctx.roundRect(0, 0, s, s, r);
  ctx.clip();

  // Draw book image as background (cover full canvas)
  ctx.drawImage(img, 0, 0, s, s);

  // Warm brown overlay for readability
  ctx.fillStyle = 'rgba(61, 43, 31, 0.45)';
  ctx.fillRect(0, 0, s, s);

  // Butterfly emoji
  ctx.font = `${s * 0.38}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🦋', s / 2, s * 0.44);

  // App name
  ctx.fillStyle = '#fdf6f0';
  ctx.font = `bold ${s * 0.1}px Georgia, serif`;
  ctx.fillText('soulful notes', s / 2, s * 0.78);

  // Subtle bottom line
  ctx.strokeStyle = '#b08070';
  ctx.lineWidth = s * 0.015;
  ctx.beginPath();
  ctx.moveTo(s * 0.25, s * 0.86);
  ctx.lineTo(s * 0.75, s * 0.86);
  ctx.stroke();
}

function download(canvas, name) {
  const a = document.createElement('a');
  a.download = name;
  a.href = canvas.toDataURL('image/png');
  a.click();
}

const img = new Image();
img.src = 'nuansa buku-buku.jpg.jpg';
img.onload = () => {
  const c192 = document.getElementById('c192');
  const c512 = document.getElementById('c512');
  drawIcon(c192, img);
  drawIcon(c512, img);
  setTimeout(() => {
    download(c192, 'icon-192.png');
    setTimeout(() => download(c512, 'icon-512.png'), 500);
  }, 300);
};
img.onerror = () => {
  document.querySelector('p').textContent = 'ERROR: Pastikan file make-icons.html dibuka dari folder ProyekJurnal, bukan dari Downloads.';
};
</script>
</body>
</html>
